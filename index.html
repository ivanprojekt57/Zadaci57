<script>

let S = { tasks: [], proj: [] }, cur = null, showDone = false, view = 'dan', selP = null, pq = '';

/* v4.5: stanje veze – „bez veze” samo kad stvarno nema interneta; inače piše što ne valja (dodir na oznaku = detalji) */

      S = r; applyQ(); try { localStorage.setItem('z57S', JSON.stringify({ tasks: r.tasks, proj: r.proj })); localStorage.setItem('z57at', String(Date.now())); } catch (e) { } NET.st = 'ok'; NET.err = ''; NET.at = Date.now(); if (r.err) msg('⚠ ' + r.err);

function guessV(t) { t = t.toLowerCase(); if (/nazv|zvati|telefon/.test(t)) return 'nazvati'; if (/mail/.test(t)) return 'mail'; if (/ponud/.test(t)) return 'ponuda'; if (/sastan/.test(t)) return 'sastanak'; if (/izmjer|mjeri/.test(t)) return 'izmjera'; if (/preda/.test(t)) return 'predaja'; if (/uplat|naplat|račun/.test(t)) return 'naplata'; return 'ostalo'; }
